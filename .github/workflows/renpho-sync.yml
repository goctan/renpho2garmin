
name: RENPHO to Garmin

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Action à effectuer"
        required: true
        type: choice
        default: export-history
        options:
          - export-history
          - initialize-history
          - sync-now

  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: renpho-garmin-sync
  cancel-in-progress: false

jobs:
  renpho-sync:
    runs-on: windows-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout RENPHO sync source
        uses: actions/checkout@v4
        with:
          repository: goctan/RenphoGarminSync-CLI
          ref: patch-1
          path: source

      - name: Configure persistent storage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".rgs-cache" | Out-Null

          $configPath = "source/RenphoGarminSync.Console/config.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json

          $config.General.UseDefaultCachePath = $false
          $config.General.CustomCachePath = Join-Path $env:GITHUB_WORKSPACE ".rgs-cache"

          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath

      - name: Restore previous RENPHO state
        uses: actions/cache@v4
        with:
          path: .rgs-cache
          key: renpho-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            renpho-state-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build RENPHO sync
        run: dotnet publish source/RenphoGarminSync.Console/RenphoGarminSync.Console.csproj -c Release -o publish

      - name: Export historical FIT files
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'export-history'
        shell: pwsh
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          RENPHO_USERNAME: ${{ secrets.RENPHO_USERNAME }}
          RENPHO_PASSWORD: ${{ secrets.RENPHO_PASSWORD }}
        run: |
          ./publish/rgs.exe sync `
            --gu "$env:GARMIN_USERNAME" `
            --gpw "$env:GARMIN_PASSWORD" `
            --ru "$env:RENPHO_USERNAME" `
            --rpw "$env:RENPHO_PASSWORD" `
            --export-all-fit

      - name: Upload historical FIT files and manifest
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'export-history'
        uses: actions/upload-artifact@v4
        with:
          name: renpho-historical-fit
          path: |
            .rgs-cache/FitFiles/*.fit
            .rgs-cache/history-export-manifest.csv
          if-no-files-found: error
          retention-days: 7

      - name: Initialize historical measurements
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'initialize-history'
        shell: pwsh
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          RENPHO_USERNAME: ${{ secrets.RENPHO_USERNAME }}
          RENPHO_PASSWORD: ${{ secrets.RENPHO_PASSWORD }}
        run: |
          ./publish/rgs.exe sync `
            --gu "$env:GARMIN_USERNAME" `
            --gpw "$env:GARMIN_PASSWORD" `
            --ru "$env:RENPHO_USERNAME" `
            --rpw "$env:RENPHO_PASSWORD" `
            --initialize-history

      - name: Check historical initialization
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'sync-now')
        shell: pwsh
        run: |
          $marker = ".rgs-cache/history-initialized.txt"

          if (!(Test-Path $marker)) {
            Write-Error "Historical initialization has not been completed. Automatic sync is blocked."
            exit 1
          }

          Write-Host "Historical initialization confirmed."

      - name: Synchronize new measurements with Garmin
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'sync-now')
        shell: pwsh
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          RENPHO_USERNAME: ${{ secrets.RENPHO_USERNAME }}
          RENPHO_PASSWORD: ${{ secrets.RENPHO_PASSWORD }}
        run: |
          ./publish/rgs.exe sync `
            --gu "$env:GARMIN_USERNAME" `
            --gpw "$env:GARMIN_PASSWORD" `
            --ru "$env:RENPHO_USERNAME" `
            --rpw "$env:RENPHO_PASSWORD"
