
name: RENPHO to Garmin

on:
  workflow_dispatch:
    inputs:
      garmin_mfa_code:
        description: "Code Garmin reçu par e-mail (laisser vide si aucun code)"
        required: false
        type: string

  schedule:
    - cron: "0 15 * * *"

concurrency:
  group: renpho-garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout RENPHO sync source
        uses: actions/checkout@v4
        with:
          repository: goctan/RenphoGarminSync-CLI
          ref: patch-1
          path: source

      - name: Configure persistent storage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".rgs-cache" | Out-Null

          $configPath = "source/RenphoGarminSync.Console/config.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json

          $config.General.UseDefaultCachePath = $false
          $config.General.CustomCachePath = Join-Path $env:GITHUB_WORKSPACE ".rgs-cache"

          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath

      - name: Restore previous RENPHO and Garmin state
        uses: actions/cache@v4
        with:
          path: .rgs-cache
          key: renpho-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            renpho-state-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build RENPHO sync
        run: dotnet publish source/RenphoGarminSync.Console/RenphoGarminSync.Console.csproj -c Release -o publish

      - name: Complete Garmin email verification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.garmin_mfa_code != '' }}
        shell: pwsh
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_MFA_CODE: ${{ inputs.garmin_mfa_code }}
        run: |
          ./publish/rgs.exe auth garmin --u "$env:GARMIN_USERNAME" --mfa "$env:GARMIN_MFA_CODE"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Synchronize new measurements with Garmin
        shell: pwsh
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          RENPHO_USERNAME: ${{ secrets.RENPHO_USERNAME }}
          RENPHO_PASSWORD: ${{ secrets.RENPHO_PASSWORD }}
        run: |
          $output = & ./publish/rgs.exe sync `
            --gu "$env:GARMIN_USERNAME" `
            --gpw "$env:GARMIN_PASSWORD" `
            --ru "$env:RENPHO_USERNAME" `
            --rpw "$env:RENPHO_PASSWORD" 2>&1

          $exitCode = $LASTEXITCODE

          $output | ForEach-Object { Write-Host $_ }
          $log = $output | Out-String

          if ($exitCode -ne 0) {
            if ($log -match '(?i)MfaNotFinished|MfaRequired|MFA code required to finish authorization process|MFA is not yet finished') {
              Write-Host "::notice::Demande MFA Garmin détectée. L'état d'authentification sera sauvegardé pour la prochaine exécution."
              exit 0
            }

            exit $exitCode
          }
